server.port=${PORT:8089}

# Recherche les variables de Render, sinon utilise localhost par d\u00c3\u00a9faut pour votre PC local
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:banque}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=20000

# Configuration Synchronisation Edge vers Cloud Central Render
cloud.url=${CLOUD_URL:https://api-banque-expendadeur.onrender.com}
edge.sync.client-id=${EDGE_SYNC_CLIENT_ID:SMARTBANK_MOBILE_CLIENT}
edge.sync.client-secret=${EDGE_SYNC_CLIENT_SECRET:SmartBank2026!}
